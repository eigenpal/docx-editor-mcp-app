<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>docx-editor MCP App harness</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #faf9f5;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141413;
          color: #faf9f5;
        }
      }
      .bar {
        padding: 8px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .bar button {
        padding: 6px 10px;
      }
      .conversation {
        flex: 1;
        overflow: auto;
        padding: 16px;
        display: flex;
        justify-content: center;
      }
      .slot {
        width: 640px;
        max-width: 100%;
      }
      iframe {
        width: 100%;
        height: 160px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        border-radius: 12px;
        background: transparent;
        display: block;
      }
      body[data-mode='fullscreen'] .conversation {
        padding: 0;
      }
      body[data-mode='fullscreen'] .slot {
        width: 100%;
        height: 100%;
      }
      body[data-mode='fullscreen'] iframe {
        height: 100%;
        border-radius: 0;
      }
      pre {
        margin: 0;
        padding: 8px;
        font-size: 11px;
        max-height: 160px;
        overflow: auto;
        background: rgba(128, 128, 128, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button id="deliver">1. deliver open_document result</button>
      <button id="openfile">open as file (file entrypoint)</button>
      <button id="agentedit">agent edits file</button>
      <button id="torn">agent edits file (torn write)</button>
    </div>
    <div class="conversation">
      <div class="slot">
        <iframe
          id="frame"
          data-src="/__harness/frame.html?v=HARNESS_BUILD"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
      </div>
    </div>
    <pre id="log"></pre>
    <script type="module" src="/__harness/host.js?v=HARNESS_BUILD"></script>
  </body>
</html>
