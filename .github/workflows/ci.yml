name: CI

# `lint` and `test` run in parallel; `build needs: [lint, test]` so the widget
# can never be bundled before lint has passed.
#
# Dependabot PRs are handled by dependabot-lockfile.yml (which refreshes
# bun.lock first and then runs the same checks inline), so they are skipped
# here. GitHub treats skipped required checks as passing, so branch protection
# still works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default GITHUB_TOKEN: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck

  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    if: github.actor != 'dependabot[bot]'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Builds the inline widget, the CLI bundle, and the third-party notices.
      - run: bun run build
      # The npm package: the CLI starts, and the tarball holds every file the
      # plugin needs (npm skips dot-folders unless they are listed by path).
      - run: node dist/cli.js --version
      - run: bun run smoke
      - run: node scripts/build-local-packages.mjs
      - run: bun run smoke:packages
      - run: npm pack --dry-run 2>&1 | tee pack.txt
      - run: |
          for f in .codex-plugin/plugin.json .agents/plugins/marketplace.json .mcp.json dist/cli.js dist/app/editor.html dist/app/editor.hash dist/app/harfbuzz.wasm THIRD_PARTY_NOTICES.md LICENSE-PLUGIN.md assets/icon.svg skills/docx-editor/SKILL.md; do
            grep -q " $f$" pack.txt || { echo "missing from the package: $f"; exit 1; }
          done

      # The server reads the bundle at startup and the resource URI is derived
      # from its bytes, so a build that produces an unservable resource is worth
      # catching here rather than in a host.
      - name: Hosted mode answers tools/list
        run: |
          bun run start &
          for _ in $(seq 1 40); do curl -sf http://localhost:3000/health && break; sleep 0.25; done
          curl -sf -X POST http://localhost:3000/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q open_document
