name: Release packages

on:
  workflow_dispatch:
    inputs:
      demo_url:
        description: Public HTTPS URL for the review demonstration
        required: false
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - run: bun run engine:check
      - run: bun run release:verify
        env:
          DEMO_URL: ${{ inputs.demo_url }}
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/local-packages/claude/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: official-listing-packages
          path: |
            dist/local-packages/*.zip
            dist/local-packages/*.mcpb
            dist/local-packages/*.sha256
            dist/local-packages/verification.json
          if-no-files-found: error
