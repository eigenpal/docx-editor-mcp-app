name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install the pinned scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/docx-gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir /tmp/docx-gitleaks
          cd /tmp/docx-gitleaks
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan fetched history
        run: /tmp/docx-gitleaks/gitleaks git . --log-opts=--all --redact --no-banner
