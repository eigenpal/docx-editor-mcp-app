name: Native atomic swaps

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: node scripts/test-native.mjs
      - uses: actions/upload-artifact@v7
        if: matrix.runner != 'macos-15-intel'
        with:
          name: native-${{ matrix.runner }}
          path: dist/native/*
          if-no-files-found: error
